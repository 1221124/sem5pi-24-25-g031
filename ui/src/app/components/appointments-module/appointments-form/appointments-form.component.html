<form (ngSubmit)="submitForm()">

  <div class="form-group">
    <label for="appointmentDateStart">Appointment Date</label>
    <input type="datetime-local" class="form-control" [(ngModel)]="appointment.AppointmentDate.Start" name="appointmentDateStart" required (change)="onAppointmentDateChange()" />
  </div>

  <div class="form-group">
    <label for="surgeryRoom">Surgery Room</label>
    <select [(ngModel)]="appointment.SurgeryRoomNumber" name="surgeryRoom" class="form-control">
      <option *ngFor="let room of surgeryRooms" [value]="room.SurgeryRoomNumber">{{ room.SurgeryRoomNumber }}</option>
    </select>
  </div>

  <div *ngIf="requiredStaff.length > 0">
    <div *ngFor="let staff of requiredStaff">
      <ng-container *ngIf="getAvailableStaffForRole(staff) as availableStaff">
        <div *ngFor="let available of availableStaff">
          <label>
            <input
              type="checkbox"
              [(ngModel)]="appointment.AssignedStaff"
              [value]="available.licenseNumber"
              name="assignedStaff_{{ available.licenseNumber }}"
            />
            License Number: {{ available.licenseNumber }}
          </label>
        </div>
  
        <div *ngIf="availableStaff.length < staff.Quantity">
          Not enough staff available for role: {{ staff.Role }} with specialization: {{ staff.Specialization }}
        </div>
      </ng-container>
    </div>
  </div>  

  <div class="form-group">
    <button type="submit" class="btn btn-primary" 
      [disabled]="!appointment.RequestCode || !appointment.SurgeryRoomNumber || !appointment.AppointmentDate.Start">
      {{ appointment.Id ? 'Update Appointment' : 'Create Appointment' }}
    </button>
  </div>

  <div class="form-group">
    <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
  </div>
</form>

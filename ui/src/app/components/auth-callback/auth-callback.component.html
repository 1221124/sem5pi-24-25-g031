<div class="container">
  <div class="auth-callback">
    <h2>Authentication</h2>
    <div *ngIf="message" [ngClass]="{ 'message-container': true, 'error': isError }">
      <p>{{ message }}</p>
    </div>
    <div *ngIf="!message && !isError" class="loading">
      <div class="loading-spinner">
        <div class="spinner"></div>
      </div>
      <p>We're processing your authentication...</p>
    </div>
  </div>
</div>

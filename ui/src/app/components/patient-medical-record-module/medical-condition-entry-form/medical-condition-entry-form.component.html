<div class="medical-condition-entry-form">
  <h2>{{ isEdit ? 'Edit' : 'Add' }} Medical Condition Entry</h2>

  <div class="form-group">
    <label for="icd11Code">ICD-11 Code:</label>
    <input
      id="icd11Code"
      type="text"
      [(ngModel)]="medicalCondition.ICD11Code"
      (ngModelChange)="validateICD11Code($event)"
      placeholder="Enter ICD-11 Code"
      class="form-control"
      [class.invalid]="isError"
    />
    <div *ngIf="isError" class="error-message">
      {{ message }}
    </div>
  </div>  

  <div class="form-group">
    <label>
      <input
        type="checkbox"
        [(ngModel)]="medicalCondition.notMeaningfulAnymore"
      />
      Mark as not meaningful anymore
    </label>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" [disabled]="isError" (click)="saveMedicalCondition()">Save</button>
    <button class="btn btn-secondary" (click)="closeMedicalCondition.emit()">Cancel</button>
  </div>
</div>
